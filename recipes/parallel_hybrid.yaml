name: "Parallel Hybrid Recipe"
description: "Pipeline using Graphify and Cangjie in parallel"
version: "1.0"

pipeline:
  - agent: "graphify-agent"
    role: "Extract structural knowledge graph"
    mode: "parallel"
  - agent: "cangjie-agent"
    role: "Distill mental models"
    mode: "parallel"
  - agent: "book-to-skill-agent"
    role: "Assemble final SKILL.md artifact"

evaluation:
  agent: "judge-agent"
  ground_truth_path: "data/ground_truth/{book_id}/concepts.json"
  output_format: "matches.json"
